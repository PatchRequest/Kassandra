[package]
name = "bof-loader"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
codegen-units = 1
opt-level = "z"
lto = true

[dependencies]
byteorder = "1.5.0"
goblin = { version = "0.10", features = ["alloc"] }
callghost = { git = "https://github.com/PatchRequest/CallGhost", branch = "master" }

windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
] }

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
